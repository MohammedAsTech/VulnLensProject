name: VulnLens Security Scan

# Run on every push and pull request to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest tree-sitter tree-sitter-cpp

      - name: Run tests
        run: python -m pytest -q

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to the Security tab
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install C++ scanning support
        run: pip install tree-sitter tree-sitter-cpp

      - name: Run VulnLens (SARIF output)
        # The scanner exits non-zero when it finds issues; don't fail the whole
        # job on that, so the SARIF upload still runs and posts the alerts.
        run: python main.py . --format sarif > vulnlens.sarif
        continue-on-error: true

      - name: Upload results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vulnlens.sarif
